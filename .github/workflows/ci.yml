name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Build and core checks
    # Current Icon Composer asset requires Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --disable-sandbox

      - name: Core checks
        run: .build/debug/CoreChecks

      - name: Check runner contracts
        run: python3 -m unittest discover -s Tests/CheckRunners

      - name: Playback log privacy and storage checks
        run: .build/debug/PlaybackLogChecks

      - name: Upscaler preferences and fallback policy
        run: .build/debug/SuperResolutionChecks

      - name: Share extension checks (headless)
        run: bash scripts/share-checks.sh

      - name: Window keyboard checks (headless)
        run: bash scripts/keyboard-checks.sh

      - name: Source registry checks
        run: |
          .build/debug/SourceRegistryChecks
          python3 scripts/source-registry-checks.py

      - name: Network share and navigation checks
        run: python3 scripts/network-share-checks.py

      - name: Resolver checks
        run: |
          python3 scripts/check_build.py ResolverChecks
          build/checks/ResolverChecks

      - name: Website session checks
        run: |
          python3 scripts/check_build.py WebsiteSessionChecks
          build/checks/WebsiteSessionChecks

      - name: History credential storage checks (headless)
        run: python3 scripts/history-credential-checks.py

      - name: Settings checks
        run: |
          python3 scripts/check_build.py SettingsChecks
          build/checks/SettingsChecks

      - name: Receiver waiting-screen checks
        run: python3 scripts/waiting-screen-checks.py

      - name: Packaging script and CLI smoke
        run: |
          bash scripts/build.sh
          codesign --verify --strict build/AirThrow.app
          ./build/athrow --help

  media-suites:
    name: Media checks (${{ matrix.group }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        group: [remux, controller, catalogs, preparation]
    steps:
      - uses: actions/checkout@v4

      - name: Install helpers
        run: brew install ffmpeg yt-dlp deno

      - name: Build
        run: swift build --disable-sandbox

      - name: Incremental WebDAV audio and subtitles
        if: matrix.group == 'remux'
        run: python3 scripts/incremental-share-checks.py

      - name: Long remote index checks
        if: matrix.group == 'remux'
        run: python3 scripts/remote-index-checks.py

      - name: Native media matrix
        if: matrix.group == 'remux'
        run: python3 scripts/native-media-checks.py

      - name: Source-choice controller checks
        if: matrix.group == 'controller'
        run: python3 scripts/source-choice-checks.py

      - name: Playback lifecycle checks
        if: matrix.group == 'controller'
        run: python3 scripts/source-choice-checks.py --controller
      - name: System playback controls and artwork
        if: matrix.group == 'controller'
        run: python3 scripts/source-choice-checks.py --system-playback

      - name: IPTV catalog and channel checks
        if: matrix.group == 'catalogs'
        run: python3 scripts/iptv-checks.py

      - name: Xtream API client checks
        if: matrix.group == 'catalogs'
        run: python3 scripts/xtream-checks.py

      - name: HTTP server authentication checks
        if: matrix.group == 'catalogs'
        run: python3 scripts/http-authentication-checks.py

      - name: Preparation and HTTP delivery checks
        if: matrix.group == 'preparation'
        run: python3 scripts/preparation-checks.py

  media:
    name: Media correctness checks
    needs: media-suites
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every media group
        run: test "${{ needs.media-suites.result }}" = success
