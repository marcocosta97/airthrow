name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and verify
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    env:
      CODE_SIGN_IDENTITY: ${{ vars.CODE_SIGN_IDENTITY }}
      NOTARY_KEYCHAIN_PROFILE: AirThrow-release
    steps:
      - name: Require GitHub-hosted runner
        env:
          RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if [[ "$RELEASE_RUNNER_ENVIRONMENT" != "github-hosted" ]]; then
            echo "::error::Release signing requires a GitHub-hosted runner"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version

      - name: Require Apple Silicon
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::Release builds must run on arm64"
            exit 1
          fi

      - name: Validate release tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release tag: ${TAG}"
            exit 1
          fi
          echo "Building release ${TAG}"

      - name: Verify tag matches checkout
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${TAG}")"
          git checkout --detach "$tag_commit"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Tag ${TAG} is not an ancestor of origin/main"
            exit 1
          fi
          echo "Tag ${TAG} resolves to ${tag_commit}"

      - name: Build
        run: swift build --disable-sandbox

      - name: Core checks
        run: .build/debug/CoreChecks

      - name: Share extension checks (headless)
        run: bash scripts/share-checks.sh

      - name: Source registry checks
        run: .build/debug/SourceRegistryChecks

      - name: Release packaging checks
        run: python3 -m unittest discover -s Tests/CheckRunners

      - name: Install signing identity and notarization credentials
        env:
          AIRTHROW_SIGNING_KEYCHAIN: ${{ runner.temp }}/airthrow-signing.keychain-db
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in CODE_SIGN_IDENTITY DEVELOPER_ID_CERTIFICATE_BASE64 DEVELOPER_ID_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing release setting: $name"
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/airthrow-certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          security list-keychains -d user > "$RUNNER_TEMP/airthrow-keychains.txt"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$AIRTHROW_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$AIRTHROW_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$AIRTHROW_SIGNING_KEYCHAIN"
          security import "$certificate" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 -k "$AIRTHROW_SIGNING_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$AIRTHROW_SIGNING_KEYCHAIN" >/dev/null
          python3 - "$AIRTHROW_SIGNING_KEYCHAIN" "$RUNNER_TEMP/airthrow-keychains.txt" <<'PY'
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[2]).read_text())
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", sys.argv[1], *original], check=True)
          PY
          xcrun notarytool store-credentials "$NOTARY_KEYCHAIN_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$AIRTHROW_SIGNING_KEYCHAIN"

      - name: Package release
        env:
          TAG: ${{ env.RELEASE_TAG }}
          AIRTHROW_SIGNING_KEYCHAIN: ${{ runner.temp }}/airthrow-signing.keychain-db
        run: bash scripts/package-release.sh "$TAG"

      - name: Verify release artifacts
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="build/release/AirThrow-${version}-arm64.zip"
          if [[ ! -f "$asset" ]]; then
            echo "::error::Missing ${asset}"
            exit 1
          fi
          unzip -tq "$asset"
          extracted="$(mktemp -d "$RUNNER_TEMP/airthrow-verify.XXXXXX")"
          trap 'rm -rf "$extracted"' EXIT
          ditto -x -k "$asset" "$extracted"
          codesign --verify --deep --strict "$extracted/AirThrow.app"
          xcrun stapler validate "$extracted/AirThrow.app"
          spctl --assess --type execute --verbose=4 "$extracted/AirThrow.app"

      - name: Remove signing assets
        if: always()
        env:
          AIRTHROW_SIGNING_KEYCHAIN: ${{ runner.temp }}/airthrow-signing.keychain-db
        run: |
          set -euo pipefail
          cleanup_exit=0
          if [[ -f "$AIRTHROW_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$AIRTHROW_SIGNING_KEYCHAIN" || cleanup_exit=$?
          fi
          if [[ -f "$RUNNER_TEMP/airthrow-keychains.txt" ]]; then
            python3 - "$RUNNER_TEMP/airthrow-keychains.txt" <<'PY' || cleanup_exit=$?
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *original], check=True)
          PY
          fi
          rm -f "$RUNNER_TEMP/airthrow-certificate.p12" "$RUNNER_TEMP/airthrow-keychains.txt"
          exit "$cleanup_exit"

      - name: Upload notarization reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-reports
          path: build/notarization*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: build/release/AirThrow-*-arm64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: build/release

      - name: Prepare release notes
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p build/release
          {
            printf '# AirThrow %s\n\n' "$version"
            cat <<'EOF'
          Apple Silicon (arm64) build for macOS 14 (Sonoma) and later.

          Signed with Developer ID, notarized by Apple, and packaged with a
          stapled notarization ticket.

          Homebrew users: no `brew upgrade` until the tap cask is updated after
          this release is published.
          EOF
          } > build/release/RELEASE_NOTES.md

      - name: Create or update draft release
        env:
          TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release tag: ${TAG}"
            exit 1
          fi
          version="${TAG#v}"
          asset="build/release/AirThrow-${version}-arm64.zip"
          notes="build/release/RELEASE_NOTES.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release ${TAG} is already published; refusing to modify it"
              exit 1
            fi
            echo "Updating existing draft release ${TAG}"
            gh release upload "$TAG" "$asset" --clobber
          else
            echo "Creating draft release ${TAG}"
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "AirThrow ${version}" \
              --notes-file "$notes" \
              "$asset"
          fi
